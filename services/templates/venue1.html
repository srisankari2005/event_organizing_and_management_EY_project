<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Venue Details | Evento</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: "Segoe UI", sans-serif;
    background: url("https://d397bfy4gvgcdm.cloudfront.net/429895-JCS54352.jpeg") no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    color: #fff;
}

/* HEADER */
header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 50px;
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
}

header .logo {
    font-size: 28px;
    font-weight: bold;
    color: #f5c400;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 30px;
    margin: 0;
    padding: 0;
}

nav ul li a {
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    font-size: 16px;
}

nav ul li a:hover {
    color: #f5c400;
}

/* SECTION */
.section {
    max-width: 1000px;
    margin: 50px auto;
    background: rgba(0,0,0,0.7);
    padding: 30px;
    border-radius: 12px;
}

/* VENUE TOP LAYOUT */
.venue-top {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.venue-image img {
    width: 300px;
    height: 250px;
    border-radius: 12px;
    object-fit: cover;
}

.venue-info {
    flex: 1;
}

.venue-info h1 {
    color: #f5c400;
    margin-bottom: 15px;
    font-size: 32px;
}

.info-box {
    margin: 8px 0;
    font-size: 16px;
}

.book-btn {
    margin-top: 15px;
    padding: 12px 20px;
    background: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

/* RATING */
.rating {
    margin-top: 20px;
    font-size: 20px;
    color: gold;
}

/* DESCRIPTION */
.description {
    margin-top: 20px;
    font-size: 16px;
}

/* FEEDBACK & REFERENCE */
#feedbackButtons button {
    margin-top: 30px;
    padding: 10px 18px;
    margin-right: 10px;
    border-radius: 6px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    background: #f5c400;
    color: #222;
    transition: 0.3s;
}

#feedbackButtons button:hover {
    background: gold;
}

#feedbackContainer img {
    cursor: pointer;
}

.feedback-item {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.feedback-item .rating {
    color: gold;
}

.feedback form input,
.feedback form textarea,
.feedback form select {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: none;
    background: rgba(0,0,0,0.6);
    color: #fff;
}

.feedback form button {
    padding: 12px 18px;
    border-radius: 8px;
    border: none;
    background: #f5c400;
    font-weight: bold;
    cursor: pointer;
}

/* BOOKING MODAL */
#bookingModal {
    display: none;
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    z-index: 2000;
}

#bookingModalContent {
    background:#222;
    padding:20px;
    border-radius:12px;
    width:400px;
    color:#fff;
    position:relative;
}

#bookingModalContent span {
    position:absolute;
    top:10px;
    right:15px;
    cursor:pointer;
    font-size:20px;
}
#bookingModalContent input,
#bookingModalContent button {
    width:100%;
    margin-top:10px;
    padding:10px;
    border-radius:6px;
    border:none;
}
#bookingModalContent button {
    background:#4CAF50;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}
#qrCode {
    display: none;
    margin-top:15px;
    text-align:center;
    background:#fff;
    padding:10px;
    border-radius:12px;
}
button.back-btn {
        margin-top: 50px;
        padding: 12px 28px;
        background: #f5c400;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
        transition: 0.3s;
    }

    button.back-btn:hover {
        transform: scale(1.05);
    }
</style>
</head>
<body>

<header>
    <div class="logo">Evento</div>
    
</header>


<section class="section" id="venueDetails">
    <div class="venue-top">
        <div class="venue-image">
            <img id="venueImage" src="https://i.pinimg.com/736x/87/71/40/8771406cfe61c3596bf3e9a2ae844ab4.jpg" alt="Venue Image">
        </div>

        <div class="venue-info">
            <h1 id="venueName">Venue Name</h1>
            <div class="info-box"><strong>Location:</strong> <span id="venueLocation"></span></div>
            <div class="info-box"><strong>Price:</strong> ₹<span id="venuePrice"></span></div>
            <div class="info-box"><strong>Type:</strong> <span id="venueType"></span></div>
            <div class="info-box"><strong>Status:</strong> <span id="venueAvailability">Available</span></div>
            <button class="book-btn" onclick="openBookingModal()">Book Now</button>
        </div>
    </div>

    <div class="rating" id="venueRating">★★★★☆</div>

    <div class="description" id="venueDescription">
        This is a beautiful venue suitable for weddings, corporate events, and private parties.
    </div>

    <div class="feedback">
        <div id="feedbackButtons">
            <button onclick="showReference()">Reference</button>
            <button onclick="showFeedbackForm()">Feedback</button>
        </div>
        <div id="feedbackContainer"></div>
        <div id="feedbackList"></div>
    </div>
    <button class="back-btn" onclick="window.location.href='{% url 'venue' %}'">
        ← Back to Venue
    </button>
</section>

<!-- BOOKING MODAL -->
<div id="bookingModal">
    <div id="bookingModalContent">
        <span onclick="closeBookingModal()">✖</span>
        <h2>Book Venue</h2>
        <form id="bookingForm">
            <input type="text" id="bookName" placeholder="Your Name" required>
            <input type="tel" id="bookPhone" placeholder="Phone" required>
            <input type="text" id="bookAddress" placeholder="Address" required>
            <input type="email" id="bookEmail" placeholder="Email" required>
            <input type="date" id="bookDate" required>
            <input type="time" id="bookTime" required>
            <input type="text" id="bookTransaction" placeholder="Transaction ID" required>
            <button type="submit">Confirm Booking</button>
        </form>
        <div id="qrCode"></div>
    </div>
</div>

<!-- QR Code Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
// Mock venue database
const venues = {
    "Thirumalai Mahal": {
        image: "https://i.pinimg.com/736x/87/71/40/8771406cfe61c3596bf3e9a2ae844ab4.jpg",
        location: "Chennai",
        price: 30000,
        type: "Banquet",
        rating: "★★★★☆"
    },
    "Kaveri Palace": {
        image: "https://example.com/kaveri.jpg",
        location: "Coimbatore",
        price: 15000,
        type: "Resort",
        rating: "★★★★☆"
    }
};

// Load venue based on URL
const params = new URLSearchParams(window.location.search);
const name = params.get("name");

if (venues[name]) {
    document.getElementById("venueName").textContent = name;
    document.getElementById("venueImage").src = venues[name].image;
    document.getElementById("venueLocation").textContent = venues[name].location;
    document.getElementById("venuePrice").textContent = venues[name].price;
    document.getElementById("venueType").textContent = venues[name].type;
    document.getElementById("venueRating").textContent = venues[name].rating;
}

// Feedback & Reference Logic
const feedbackContainer = document.getElementById("feedbackContainer");
const feedbackList = document.getElementById("feedbackList");

function showReference() {
    feedbackContainer.innerHTML = `
        <h4>Venue References:</h4>
        <div id="referenceGallery" style="display:flex;gap:10px;flex-wrap:wrap;">
            <!-- Add Your Media Box -->
            <label for="uploadMedia" 
                   style="width:150px;height:100px;border:2px dashed #f5c400;border-radius:8px;
                          display:flex;justify-content:center;align-items:center;cursor:pointer;
                          font-size:24px;color:#f5c400;text-align:center;">
                +<br><span style="font-size:12px;">Add Image/Video</span>
            </label>
            <input type="file" id="uploadMedia" accept="image/*,video/*" style="display:none;">
            
            <!-- Existing reference images -->
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0LYax3OMiIxz7VZQxjRxSkkQlDqfUvFXwXw&s" style="width:150px;height:100px;border-radius:8px;object-fit:cover;">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZw2uMLVw27s9--S3amDt04xUBB0mzeugYoQ&s" style="width:150px;height:100px;border-radius:8px;object-fit:cover;">
            <img src="${venues[name].image}" style="width:150px;height:100px;border-radius:8px;object-fit:cover;">
        </div>
    `;

    const uploadInput = document.getElementById("uploadMedia");
    const referenceGallery = document.getElementById("referenceGallery");

    uploadInput.addEventListener("change", function() {
        const file = this.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                let mediaElement;
                if(file.type.startsWith("image/")) {
                    // Create an image element
                    mediaElement = document.createElement("img");
                    mediaElement.src = e.target.result;
                    mediaElement.style.width = "150px";
                    mediaElement.style.height = "100px";
                    mediaElement.style.objectFit = "cover";
                    mediaElement.style.borderRadius = "8px";
                } else if(file.type.startsWith("video/")) {
                    // Create a video element
                    mediaElement = document.createElement("video");
                    mediaElement.src = e.target.result;
                    mediaElement.controls = true;
                    mediaElement.style.width = "150px";
                    mediaElement.style.height = "100px";
                    mediaElement.style.objectFit = "cover";
                    mediaElement.style.borderRadius = "8px";
                }
                referenceGallery.insertBefore(mediaElement, referenceGallery.children[1]); // insert after add box
            }
            reader.readAsDataURL(file);
        }
    });
}



function showFeedbackForm() {
    feedbackContainer.innerHTML = `
        <h4>Give Feedback:</h4>
        <form id="feedbackForm">
            <input type="text" id="customerName" placeholder="Your Name" required>
            <textarea id="customerComment" placeholder="Your Comment" rows="3" required></textarea>
            <select id="customerRating" required>
                <option value="">Rating</option>
                <option value="1">★☆☆☆☆</option>
                <option value="2">★★☆☆☆</option>
                <option value="3">★★★☆☆</option>
                <option value="4">★★★★☆</option>
                <option value="5">★★★★★</option>
            </select>
            <button type="submit">Submit Feedback</button>
        </form>
    `;

    const feedbackForm = document.getElementById("feedbackForm");
    feedbackForm.addEventListener("submit", (e)=>{
        e.preventDefault();
        const fname = document.getElementById("customerName").value;
        const comment = document.getElementById("customerComment").value;
        const rating = document.getElementById("customerRating").value;

        const div = document.createElement("div");
        div.className = "feedback-item";
        div.innerHTML = `<strong>${fname}</strong> - <span class="rating">${'★'.repeat(rating)+'☆'.repeat(5-rating)}</span><br>${comment}`;
        feedbackList.appendChild(div);

        feedbackForm.reset();
        feedbackContainer.innerHTML = ""; // hide form after submission
    });
}

// BOOKING MODAL FUNCTIONS
const bookingModal = document.getElementById("bookingModal");
function openBookingModal(){ bookingModal.style.display="flex"; }
function closeBookingModal(){ bookingModal.style.display="none"; }

// BOOKING FORM SUBMIT
const bookingForm = document.getElementById("bookingForm");
bookingForm.addEventListener("submit", function(e){
    e.preventDefault();

    const bookingDetails = {
        venue: name,
        location: venues[name].location,
        name: document.getElementById("bookName").value,
        phone: document.getElementById("bookPhone").value,
        address: document.getElementById("bookAddress").value,
        email: document.getElementById("bookEmail").value,
        date: document.getElementById("bookDate").value,
        time: document.getElementById("bookTime").value,
        transaction: document.getElementById("bookTransaction").value,
        price: venues[name].price
    };

    const qrText = JSON.stringify(bookingDetails);

    // Hide the form
    bookingForm.style.display = "none";

    // Show confirmation/invoice
    const qrDiv = document.getElementById("qrCode");
    qrDiv.style.display = "block";

    qrDiv.innerHTML = `
        <h3 style="color:#222;">Booking Confirmed!</h3>
        <p><strong>Venue:</strong> ${bookingDetails.venue}</p>
        <p><strong>Customer:</strong> ${bookingDetails.name}</p>
        <p><strong>Phone:</strong> ${bookingDetails.phone}</p>
        <p><strong>Email:</strong> ${bookingDetails.email}</p>
        <p><strong>Date & Time:</strong> ${bookingDetails.date} ${bookingDetails.time}</p>
        <p><strong>Transaction ID:</strong> ${bookingDetails.transaction}</p>
        <p><strong>Amount:</strong> ₹${bookingDetails.price}</p>
        <canvas id="qrCanvas"></canvas>
        <p style="font-size:12px;color:#555;">Save this QR code for your booking.</p>
    `;

    // Generate QR code in the canvas
    QRCode.toCanvas(document.getElementById("qrCanvas"), qrText, { width: 180, margin: 2 })
        .then(() => {
            const msg = new SpeechSynthesisUtterance(`Booking confirmed for ${bookingDetails.name} at ${bookingDetails.venue} on ${bookingDetails.date} at ${bookingDetails.time}. Your transaction ID is ${bookingDetails.transaction}`);
            window.speechSynthesis.speak(msg);
        })
        .catch(err => console.error(err));
});

// Preloaded feedback data (20 feedbacks)
const defaultFeedbacks = [
    { name: "Arun", rating: 5, comment: "Amazing venue! Spacious and very clean." },
    { name: "Priya", rating: 4, comment: "Beautiful decorations and good lighting." },
    { name: "Karthik", rating: 5, comment: "Perfect place for weddings. Highly recommended." },
    { name: "Divya", rating: 4, comment: "Parking space was sufficient and well managed." },
    { name: "Ramesh", rating: 5, comment: "Staff were very supportive throughout the event." },
    { name: "Sneha", rating: 3, comment: "Good venue but food arrangements can improve." },
    { name: "Vignesh", rating: 4, comment: "Nice ambience and easy location access." },
    { name: "Meena", rating: 5, comment: "Loved the hall interior and stage setup." },
    { name: "Suresh", rating: 4, comment: "Worth the price. Clean washrooms." },
    { name: "Kavya", rating: 5, comment: "Best venue I have seen in this budget." },
    { name: "Nithin", rating: 4, comment: "Lighting and sound system were excellent." },
    { name: "Anitha", rating: 5, comment: "Very professional management team." },
    { name: "Balaji", rating: 3, comment: "Good venue but AC was average." },
    { name: "Harini", rating: 5, comment: "My wedding went smoothly because of this venue." },
    { name: "Rajesh", rating: 4, comment: "Spacious hall and neat surroundings." },
    { name: "Pooja", rating: 5, comment: "Loved everything about this place!" },
    { name: "Mohan", rating: 4, comment: "Nice place for receptions and parties." },
    { name: "Deepa", rating: 5, comment: "Excellent service and hospitality." },
    { name: "Ganesh", rating: 4, comment: "Good value for money venue." },
    { name: "Lavanya", rating: 5, comment: "Highly satisfied with the venue experience." }
];

// Load feedbacks on page load
function loadDefaultFeedbacks() {
    defaultFeedbacks.forEach(fb => {
        const div = document.createElement("div");
        div.className = "feedback-item";
        div.innerHTML = `
            <strong>${fb.name}</strong> - 
            <span class="rating">${'★'.repeat(fb.rating)}${'☆'.repeat(5 - fb.rating)}</span>
            <br>${fb.comment}
        `;
        feedbackList.appendChild(div);
    });
}

// Call this after page loads
loadDefaultFeedbacks();


</script>

</body>
</html>
